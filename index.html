<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geld">
<meta name="theme-color" content="#0c0e12">
<meta name="color-scheme" content="dark">
<script>/* standalone (Home Screen) detection before first paint — see html.standalone in CSS */
(function(){ try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone'); } catch(e){} })();</script>
<meta name="format-detection" content="telephone=no">
<title>Geld</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#0c0e12; --bg2:#12151b; --card:#181c23; --card2:#1f242d; --line:#ffffff12;
  --text:#f3f5f8; --muted:#9aa3b2; --faint:#6b7483;
  --accent:#2ec4b6; --accent2:#7c6cff; --good:#3ddc97; --bad:#ff6b6b; --warn:#ffca3a;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --tabh:62px; --colw:min(430px,100vw);
  --tabpb:max(10px, calc(var(--sab) - 6px));            /* space under the floating tab bar (home indicator) */
  --tabbar:calc(var(--tabh) + 6px + var(--tabpb));        /* full height of the tab bar area */
  --apph:100vh;
}
@supports (height:100dvh){ :root{ --apph:100dvh } }
/* iOS 26+ Home Screen apps report 100dvh/innerHeight short by the status-bar height, leaving an empty strip under the tab bar.
   In standalone mode size the shell to the large viewport instead (equals the full screen there). */
html.standalone{ --apph:100lvh }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.tab,.pill,.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%;overscroll-behavior:none}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;font-size:16px;color:var(--text)}
.app{position:relative;width:var(--colw);margin:0 auto;height:var(--apph);display:flex;flex-direction:column;
  background:radial-gradient(120% 50% at 50% 0%,#17303a 0%,var(--bg) 60%);overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px #ffffff10,0 30px 80px #0008}}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 calc(16px + var(--sar)) calc(var(--tabbar) + 58px + 36px) calc(16px + var(--sal))}
.scroller::-webkit-scrollbar{display:none}
header.top{padding:calc(var(--sat) + 4px) calc(16px + var(--sar)) 6px calc(16px + var(--sal));
  position:relative;z-index:5;background:linear-gradient(#0c0e12f0,#0c0e1200)}
.brand{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:750;display:flex;align-items:center;gap:8px}
.brand h1 .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) 0 35%,#ff9f1c 0 55%,var(--accent2) 0 80%,#ff5d8f 0);
  -webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
.brand .sub{color:var(--muted);font-size:13px}
.periodbar{margin-top:4px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{min-height:38px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px;transition:background .2s,color .2s}
.seg button.on{background:var(--text);color:#0c0e12}
.seg.wide button{flex:1;padding:0 6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;min-width:0}
.nav .lbl{min-height:44px;padding:0 14px;border-radius:999px;font-weight:700;font-size:17px;letter-spacing:-.01em;text-align:center;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.nav .lbl small{display:block;font-size:11.5px;font-weight:650;color:var(--accent);letter-spacing:0}
.nav .lbl:active{background:#ffffff0c}
.nav .iconbtn{background:var(--card);border:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.iconbtn:active{background:#ffffff14}
.iconbtn:disabled{opacity:.25}
.view{animation:enter .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);padding:14px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.pill.on{background:#2ec4b622;border-color:#2ec4b688;color:#bff5ef}
.donutwrap{position:relative;margin:6px auto 0;width:min(300px,78vw);aspect-ratio:1}
.donutwrap svg{width:100%;height:100%;display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.center .k{color:var(--muted);font-size:14px}
.center .v{font-size:38px;font-weight:780;letter-spacing:-.03em;margin:2px 0}
.center .v.sm{font-size:30px}
.chg{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:650;padding:3px 9px;border-radius:999px}
.chg.up{color:#ffb3b3;background:#ff6b6b22}.chg.down{color:#a6f5cf;background:#3ddc9722}.chg.flat{color:var(--muted);background:#ffffff10}
.chg.good{color:#a6f5cf;background:#3ddc9722}.chg.bad{color:#ffb3b3;background:#ff6b6b22}
.list{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);margin-top:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:60px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row:active{background:#ffffff08}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;position:relative}
.ico.ringed{box-shadow:inset 0 0 0 2.5px var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.ico.sq{border-radius:12px;background:color-mix(in srgb,var(--c) 20%,#ffffff06)}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:7px;background:#ffffff12;color:var(--muted);font-size:11.5px;font-weight:700;margin-left:6px;vertical-align:1px}
.amt{font-weight:680;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt.inc{color:var(--good)}
.pct{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:650;color:var(--muted);background:#ffffff0d;border-radius:7px;padding:1px 6px}
.right{text-align:right;flex:none}
.dayhdr{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:18px 4px 6px}
.empty{color:var(--faint);text-align:center;padding:26px 10px;font-size:15px}
.emptycard{text-align:center;padding:22px 18px 18px}
.emptycard .em{font-size:34px;line-height:1;margin-bottom:8px}
.emptycard .t{font-weight:700;font-size:17px}
.emptycard .d{color:var(--muted);font-size:14px;margin:4px auto 14px;max-width:280px}
.emptycard .btn{width:auto;min-width:200px}
.hero{text-align:center;margin-top:8px}
.hero .k{color:var(--muted);font-size:14px}
.hero .v{font-size:36px;font-weight:780;letter-spacing:-.03em}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-size:10.5px;fill:var(--faint);font-family:inherit}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat .k{color:var(--muted);font-size:12.5px}.stat .v{font-size:20px;font-weight:720;margin-top:2px;font-variant-numeric:tabular-nums}
.ringbox{position:relative;display:grid;place-items:center;flex:none}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%}
.ringbox .in{position:relative;font-size:18px;text-align:center}
.dash{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.bigring{width:min(290px,76vw);height:min(290px,76vw);margin:8px auto 0}
.bigring .in .v{font-size:36px;font-weight:780;letter-spacing:-.03em}
.bigring .in .k{color:var(--muted);font-size:14px}
.note{color:var(--faint);font-size:12.5px;text-align:center;margin-top:8px}
.btn{min-height:50px;border-radius:var(--r-md);padding:0 18px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--text);color:#0c0e12;border-color:transparent}
.btn.danger{color:#ffb3b3;background:#ff6b6b18;border-color:#ff6b6b40}
.btn.danger.arm{background:#ff6b6b;color:#1a0505}
.btnrow{display:flex;gap:10px;margin-top:14px}
.link{color:var(--accent);font-weight:650;min-height:44px;padding:0 4px}
/* tab bar & fab */
nav.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:6px calc(12px + var(--sar)) var(--tabpb) calc(12px + var(--sal));
  background:linear-gradient(#0c0e1200,#0c0e12e6 40%,#0c0e12)}
.tabsin{display:flex;background:#1a1e26e6;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;height:var(--tabh);padding:5px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);border-radius:20px;min-width:44px;transition:color .2s,background .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text);background:#ffffff12}
.fab{position:absolute;right:calc(16px + var(--sar));bottom:calc(var(--tabbar) + 12px);z-index:21;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#3be0cf,#7c6cff);color:#06120f;display:grid;place-items:center;box-shadow:0 8px 24px #2ec4b644,0 2px 6px #0007;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s}
.fab:active{transform:scale(.92)}
.fab.away{transform:translate3d(0,calc(var(--tabbar) + 80px),0);opacity:0;pointer-events:none}
/* sheets */
.overlay{position:absolute;inset:0;z-index:40;background:#000a;opacity:0;transition:opacity .25s;pointer-events:none}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - var(--sat) - 24px);display:flex;flex-direction:column;
  background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translate3d(0,105%,0);transition:transform .34s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet.open{transform:translate3d(0,0,0)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#ffffff30;margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 18px;flex:none;touch-action:none}
.sheet .grab{touch-action:none}
.sheet .sh h2{margin:0;font-size:18px}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px calc(18px + var(--sar)) calc(22px + var(--sab)) calc(18px + var(--sal))}
label.f{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:14px 2px 6px}
.inp{width:100%;min-height:50px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:#2ec4b6aa}
.inp[type=datetime-local]{display:flex;align-items:center;text-align:left;min-width:0;line-height:48px}
.inp::-webkit-date-and-time-value{text-align:left}
.amtinp{font-size:34px !important;font-weight:760;text-align:center;min-height:68px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.grid button{height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:23px;line-height:1}
.emogrid{max-height:236px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px;border-radius:16px}
.swgrid{grid-template-columns:repeat(6,1fr)}
.sw{height:46px;border-radius:14px;border:3px solid transparent;position:relative}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #0c0e12 inset}
.sw.custom{background:conic-gradient(#ff5d8f,#ffca3a,#8ac926,#2ec4b6,#3a86ff,#7c6cff,#ff5d8f);overflow:hidden;display:grid;place-items:center}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.sw.custom span{width:22px;height:22px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--text);pointer-events:none}
.ceprev{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 2px}
.ceprev .chip{pointer-events:none}
.emorow{display:flex;gap:8px;align-items:center}
.emorow .inp{flex:1;font-size:24px;text-align:center;min-height:50px}
.emorow .hint{flex:1.4;color:var(--muted);font-size:12.5px;line-height:1.3}
.chip.add{border-style:dashed;color:var(--accent);background:transparent}
.grid button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--text) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px 0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.chip.on{background:color-mix(in srgb,var(--c) 26%,var(--card));border-color:var(--c)}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 0;color:var(--muted);font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 6px);z-index:60;transform:translate3d(-50%,-10px,0) scale(.96);opacity:0;visibility:hidden;background:var(--text);color:#0c0e12;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px #0008;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s linear .28s;pointer-events:none;font-size:15px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate3d(-50%,0,0);opacity:1;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.hdrr{display:flex;align-items:center;gap:0;min-width:0;margin-right:-8px}
.hdrr .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:2px}
.samplebadge{font-size:11.5px;font-weight:700;color:#ffd98a;background:#ffca3a1f;border:1px solid #ffca3a55;border-radius:999px;padding:3px 9px;white-space:nowrap}
.sync.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--good)}
.syncdot.warn{background:var(--warn)}.syncdot.err{background:var(--bad)}
.ptr{position:absolute;left:50%;top:var(--ptrtop,calc(var(--sat) + 140px));z-index:6;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;opacity:0;transform:translate3d(0,-30px,0) rotate(0deg);pointer-events:none}
.ptr.go svg{animation:spin .9s linear infinite}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;font-size:14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.stline{font-size:13.5px;margin-top:10px;min-height:20px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1><span class="dot"></span>Geld</h1><div class="hdrr"><span class="sub" id="subtitle"></span><button class="iconbtn sync" id="syncBtn" aria-label="Sync now" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 21v-5h-5"/></svg></button><button class="iconbtn" id="gearBtn" aria-label="Sync settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div></div>
    <div class="periodbar" id="periodbar">
      <div class="seg wide" role="tablist" aria-label="Period">
        <button data-p="day">Daily</button><button data-p="week">Weekly</button><button data-p="month">Monthly</button>
      </div>
      <div class="nav">
        <button class="iconbtn" id="prev" aria-label="Previous period"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="lbl" id="plabel" aria-label="Jump to the current period"></button>
        <button class="iconbtn" id="next" aria-label="Next period"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </header>
  <div class="ptr" id="ptr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.2"/></svg></div>
  <main class="scroller" id="main"></main>

/* ============================================================================

   To use real data, set SAMPLE_DATA.transactions = yourArray (same shape).
   The generator below creates ~3 months of realistic synthetic data ending today.

function generateSampleTransactions(){
  let seed = 20261102;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd()*a.length)];
  const between = (a,b) => Math.round((a + rnd()*(b-a))*100)/100;
  const out = []; let n = 0;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-3, now.getDate());
  const add = (d, h, m, amount, categoryId, note, type='expense') => {
    const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
    if (dt > now) return;
    const p = x => String(x).padStart(2,'0');
    out.push({ id:'s'+(++n), date:`${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(h)}:${p(m)}`,
      amount, categoryId, note, type });
  };
  for (let d = new Date(start); d <= now; d.setDate(d.getDate()+1)) {
    const dom = d.getDate(), dow = d.getDay(), M = () => Math.floor(rnd()*60);
    if (dom === 1)  add(d, 8, 5, 9500, 'housing', 'Rent');
    if (dom === 2)  add(d, 6, 30, 549, 'health', 'Gym membership');
    if (dom === 3)  add(d, 9, 0, 899, 'utilities', 'Fibre internet');
    if (dom === 5)  add(d, 10, 12, 299, 'phone', 'Data bundle');
    if (dom === 7)  add(d, 0, 15, 199, 'subs', 'Streaming service');
    if (dom === 12) add(d, 0, 20, 69.99, 'subs', 'Music streaming');
    if (dom === 15) add(d, 11, 40, between(380,520), 'utilities', 'Water & rates');
    if (dom === 25) add(d, 7, 0, 32000, 'salary', 'Salary', 'income');
    if (dom === 18 && rnd() < .9) add(d, 16, 0, between(2000,6500), 'freelance', 'Freelance invoice', 'income');
    if (dom % 9 === 0) add(d, 18, M(), between(500,800), 'utilities', 'Prepaid electricity');
    // groceries ~3x/week
    if (rnd() < .42) add(d, 9+Math.floor(rnd()*10), M(), between(dow===6?600:120, dow===6?1600:650), 'groceries', pick(['Checkers','Woolworths Food','Pick n Pay','Spar','Food Lover\'s Market']));
    // eating out
    if (rnd() < (dow===5||dow===6 ? .65 : .3)) add(d, pick([7,8,12,13,19,20]), M(), between(45,480), 'eating', pick(['Coffee','Nando\'s','Sushi','Mugg & Bean','Takeaway pizza','Burger','Bakery']));
    // fuel weekly + rides
    if (dow === 1) add(d, 7, M(), between(650,950), 'transport', 'Fuel');
    if (rnd() < .12) add(d, pick([18,21,23]), M(), between(55,190), 'transport', 'Ride share');
    if (rnd() < .06) add(d, 14, M(), between(20,60), 'transport', 'Parking');
    if (rnd() < .08) add(d, 15, M(), between(150,1600), 'shopping', pick(['Takealot order','Clothing','Homeware','Hardware store']));
    if (rnd() < .07) add(d, 20, M(), between(90,420), 'fun', pick(['Cinema','Concert tickets','Bowling','Game purchase']));
    if (rnd() < .05) add(d, 12, M(), between(80,450), 'health', pick(['Pharmacy','Dentist co-pay','Vitamins']));
  }
  return out;
}
const SAMPLE_DATA = { source: 'synthetic', transactions: generateSampleTransactions() };
/* ========================== END SAMPLE DATA ========================== */

/* ============================ STORE ============================ */
const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
// Normalise categories from storage or the server: every category has type 'expense'|'income'.
function normCats(list){
  const out = (Array.isArray(list) ? list : []).filter(c => c && c.id && c.name).map(c => ({
    id:String(c.id), name:String(c.name), type:(c.type || c.kind) === 'income' ? 'income' : 'expense',
    icon:Array.from(String(c.icon || '').replace(/[<>&"']/g, '')).slice(0, 8).join('') || guessIcon(c.name, (c.type || c.kind) === 'income' ? 'income' : 'expense'),
    color:/^#[0-9a-f]{6}$/i.test(c.color || '') ? c.color : '#90A4AE',
    limit:Math.max(0, Number(c.limit) || 0), ...(c.locked ? { locked:true } : {}) }));
  if (!out.some(c => c.id === 'uncat')) out.push(clone(DEFAULT_CATEGORIES.find(c => c.id === 'uncat')));
  return out;
}
/* ---- data source: SAMPLE_DATA + local entries (not configured) or the cloud store (configured) ---- */
const syncCfg = () => store.get(CONFIG.STORAGE_KEYS.sync, null);
const isRemote = () => { const c = syncCfg(); return !!(c && c.url && c.key); };
let cache = store.get(CONFIG.STORAGE_KEYS.cache, null);      // { categories, transactions, updatedAt, syncedAt }
let queue = store.get(CONFIG.STORAGE_KEYS.queue, []);        // offline queue: [{op:'addTx'|'delTx'|'putCats', ...}]
let localCats = normCats(store.get(CONFIG.STORAGE_KEYS.categories, null) || DEFAULT_CATEGORIES);
let categories = isRemote() && cache ? normCats(cache.categories) : localCats;
let userTx = store.get(CONFIG.STORAGE_KEYS.userTx, []);
function saveCats(){
  if (isRemote()){ cache = Object.assign(cache || { transactions:[] }, { categories:clone(categories) }); store.set(CONFIG.STORAGE_KEYS.cache, cache);
    enqueue({ op:'putCats', categories:clone(categories) }); }
  else { localCats = categories; store.set(CONFIG.STORAGE_KEYS.categories, categories); }
}
function fallbackCat(type){ return type === 'income' && categories.some(c => c.id === 'other_income') ? 'other_income' : 'uncat'; }
function catById(id){ return categories.find(c => c.id === id) || categories.find(c => c.id === 'uncat'); }
function baseTx(){
  if (!isRemote()) return SAMPLE_DATA.transactions.concat(userTx);
  const dels = new Set(queue.filter(q => q.op === 'delTx').map(q => q.id));
  const have = new Set(((cache && cache.transactions) || []).map(t => t.id));
  return ((cache && cache.transactions) || []).concat(queue.filter(q => q.op === 'addTx' && !have.has(q.tx.id)).map(q => q.tx)).filter(t => !dels.has(t.id));
}
function allTx(){
  const ids = new Set(categories.map(c => c.id));
  return baseTx().map(t => {
    const o = Object.assign({}, t); o._d = new Date(t.date); o.amount = Number(o.amount) || 0;
    if (!ids.has(o.categoryId)) o.categoryId = fallbackCat(o.type); // deleted categories fall back here
    return o;
  });
}
let TX = allTx();

/* ============================ HELPERS ============================ */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n, dec){
  const neg = n < 0; n = Math.abs(n);
  const s = dec ? n.toFixed(2) : String(Math.round(n));
  let [i, d] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, CONFIG.THOUSANDS_SEP);
  return (neg ? '−' : '') + CONFIG.CURRENCY_SYMBOL + '\u00A0' + i + (d ? CONFIG.DECIMAL_SEP + d : '');
}
function short(n){ return n >= 1000 ? CONFIG.CURRENCY_SYMBOL + (n/1000).toFixed(n >= 10000 ? 0 : 1).replace('.0','') + 'k' : CONFIG.CURRENCY_SYMBOL + Math.round(n); }
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sod = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const dkey = d => d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
function range(type, anchor){
  const a = sod(anchor);
  if (type === 'day') return { start:a, end:addDays(a,1) };
  if (type === 'week'){ const off = CONFIG.WEEK_STARTS_MONDAY ? (a.getDay()+6)%7 : a.getDay(); const s = addDays(a,-off); return { start:s, end:addDays(s,7) }; }
  return { start:new Date(a.getFullYear(), a.getMonth(), 1), end:new Date(a.getFullYear(), a.getMonth()+1, 1) };
}
function shift(type, anchor, dir){
  if (type === 'day') return addDays(anchor, dir);
  if (type === 'week') return addDays(anchor, 7*dir);
  return new Date(anchor.getFullYear(), anchor.getMonth()+dir, 1);
}
function label(type, r){
  const s = r.start, e = addDays(r.end,-1);
  if (type === 'day') return `${WD[s.getDay()]} ${s.getDate()} ${MON[s.getMonth()]}`;
  if (type === 'week') return s.getMonth() === e.getMonth() ? `${s.getDate()}–${e.getDate()} ${MON[e.getMonth()]}` : `${s.getDate()} ${MON[s.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]}`;
  return `${MON[s.getMonth()]} ${s.getFullYear()}`;
}
function centreLabel(type, r){
  const now = new Date(), cur = now >= r.start && now < r.end;
  if (cur) return { day:'Today', week:'This week', month:'This month' }[type];
  const prevR = range(type, shift(type, now, -1));
  if (+prevR.start === +r.start) return { day:'Yesterday', week:'Last week', month:'Last month' }[type];
  return label(type, r);
}
const inR = (t, r) => t._d >= r.start && t._d < r.end;
const txIn = (r, type) => TX.filter(t => inR(t, r) && (!type || t.type === type));
const sum = a => a.reduce((s, t) => s + t.amount, 0);
const fmtTime = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
function changeChip(cur, prev, upIsBad = true){
  if (!prev) return `<span class="chg flat">No data for previous ${S.period==='day'?'day':S.period}</span>`;
  const p = (cur - prev) / prev * 100, up = p >= 0;
  const cls = Math.abs(p) < 0.5 ? 'flat' : ((up === upIsBad) ? 'bad' : 'good');
  const arrow = up ? '▲' : '▼';
  return `<span class="chg ${cls}">${arrow} ${Math.abs(p).toFixed(0)}% vs previous ${S.period==='day'?'day':S.period}</span>`;
}
function prorate(limit){ return S.period === 'month' ? limit : S.period === 'week' ? limit*7/30.4375 : limit/30.4375; }

/* ============================ CHARTS (SVG) ============================ */
let uid = 0;
function donut(segs, opts = {}){
  const size = 300, stroke = opts.stroke || 26, r = (size - stroke)/2 - 2, C = 2*Math.PI*r;
  const total = segs.reduce((s, x) => s + x.v, 0);
  let out = `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="150" cy="150" r="${r}" fill="none" stroke="#ffffff0d" stroke-width="${stroke}"/>`;
  if (total > 0){
    const gap = segs.length > 1 ? stroke + 6 : 0; let acc = 0;
    segs.forEach(sg => {
      const len = sg.v / total * C, dash = Math.max(0.01, len - gap);
      out += `<circle class="dash" cx="150" cy="150" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="0 ${C}" data-dash="${dash} ${C}" stroke-dashoffset="${-(acc + gap/2)}" transform="rotate(-90 150 150)"/>`;
      acc += len;
    });
  }
  return out + '</svg>';
}
function ringSVG(frac, color, stroke, track = '#ffffff14', grad){
  const size = 100, r = (size - stroke)/2, C = 2*Math.PI*r, f = Math.max(0, Math.min(1, frac));
  const id = 'g' + (++uid);
  const defs = grad ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${grad[0]}"/><stop offset="1" stop-color="${grad[1]}"/></linearGradient></defs>` : '';
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${defs}<circle cx="50" cy="50" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    ${f > 0 ? `<circle class="dash" cx="50" cy="50" r="${r}" fill="none" stroke="${grad ? `url(#${id})` : color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="0 ${C}" data-dash="${f*C} ${C}" transform="rotate(-90 50 50)"/>` : ''}</svg>`;
}
// bars: [{label, segs:[{v,c}], total, future}]
function barChart(bars, { height = 190, avg = null, labelEvery = 1 } = {}){
  const W = 360, H = height, padL = 2, padR = 36, padT = 10, padB = 22, ch = H - padT - padB;
  const max = Math.max(1, ...bars.map(b => b.total), avg || 0) * 1.08;
  const n = bars.length, slot = (W - padL - padR) / n, bw = Math.max(3, Math.min(28, slot * .64));
  const id = ++uid;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">`;
  [0, .5, 1].forEach(f => { const y = padT + ch - f*ch/1.08;
    s += `<line x1="0" x2="${W-padR+4}" y1="${y}" y2="${y}" stroke="#ffffff0c"/><text x="${W}" y="${y+3.5}" text-anchor="end">${f ? short(max/1.08*f) : '0'}</text>`; });
  bars.forEach((b, i) => {
    const x = padL + i*slot + (slot - bw)/2;
    if (b.total <= 0){ s += `<rect x="${x}" y="${padT+ch-3}" width="${bw}" height="3" rx="1.5" fill="${b.future ? '#ffffff08' : '#ffffff16'}"/>`; }
    else {
      const h = b.total / max * ch; const rx = Math.min(bw/2, 6);
      s += `<clipPath id="c${id}_${i}"><rect x="${x}" y="${padT+ch-h}" width="${bw}" height="${h}" rx="${rx}"/></clipPath><g class="bar" clip-path="url(#c${id}_${i})" style="animation-delay:${Math.min(i*14,400)}ms">`;
      let y = padT + ch;
      b.segs.forEach(sg => { const hh = sg.v / max * ch; y -= hh; s += `<rect x="${x}" y="${y}" width="${bw}" height="${hh + .4}" fill="${sg.c}"/>`; });
      s += '</g>';
    }
    if (b.label && (i % labelEvery === 0 || b.always)) s += `<text x="${x + bw/2}" y="${H-6}" text-anchor="middle">${b.label}</text>`;
  });
  if (avg){ const y = padT + ch - avg/max*ch;
    s += `<line x1="0" x2="${W-padR+4}" y1="${y}" y2="${y}" stroke="#ffffffb0" stroke-width="1.2" stroke-dasharray="4 4"/>
      <rect x="${W-padR+5}" y="${y-8}" width="${padR-5}" height="16" rx="5" fill="#f3f5f8"/><text x="${W-padR/2+2.5}" y="${y+3.5}" text-anchor="middle" style="fill:#0c0e12;font-weight:700">${short(avg)}</text>`; }
  return s + '</svg>';
}
function pairChart(groups, { height = 190 } = {}){
  const W = 360, H = height, padT = 10, padB = 22, padR = 36, ch = H - padT - padB;
  const max = Math.max(1, ...groups.flatMap(g => [g.inc, g.exp])) * 1.08;
  const slot = (W - padR) / groups.length, bw = Math.min(18, slot*.3);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income vs expenses">`;
  [0, .5, 1].forEach(f => { const y = padT + ch - f*ch/1.08;
    s += `<line x1="0" x2="${W-padR+4}" y1="${y}" y2="${y}" stroke="#ffffff0c"/><text x="${W}" y="${y+3.5}" text-anchor="end">${f ? short(max/1.08*f) : '0'}</text>`; });
  groups.forEach((g, i) => {
    const cx = i*slot + slot/2;
    [[g.inc, '#3ddc97', cx - bw - 2], [g.exp, '#ff7a6b', cx + 2]].forEach(([v, c, x], k) => {
      const h = Math.max(v/max*ch, 3);
      s += `<rect class="bar" style="animation-delay:${i*40+k*20}ms" x="${x}" y="${padT+ch-h}" width="${bw}" height="${h}" rx="${Math.min(5,bw/2)}" fill="${v ? c : '#ffffff16'}" ${g.cur ? '' : 'opacity=".55"'}/>`;
    });
    s += `<text x="${cx}" y="${H-6}" text-anchor="middle" style="${g.cur ? 'fill:#f3f5f8;font-weight:700' : ''}">${g.label}</text>`;
  });
  return s + '</svg>';
}
function animateDashes(root){

}

function catBreakdown(list){
  const m = new Map();
  list.forEach(t => { const e = m.get(t.categoryId) || { cat:catById(t.categoryId), v:0, n:0 }; e.v += t.amount; e.n++; m.set(t.categoryId, e); });
  return [...m.values()].sort((a, b) => S.sort === 'name' ? a.cat.name.localeCompare(b.cat.name) : S.sort === 'count' ? b.n - a.n : b.v - a.v);
}
function viewSummary(r, pr){

  const bd = catBreakdown(list);

  return `
  <div class="pills">
    <button class="pill ${S.sumType==='expense'?'on':''}" data-act="sumType" data-v="expense">Expenses</button>
    <button class="pill ${S.sumType==='income'?'on':''}" data-act="sumType" data-v="income">Income</button>

  </div>

    <div class="center"><div class="k">${centreLabel(S.period, r)}${S.sumType==='income'?' · income':''}</div><div class="v ${total>=100000?'sm':''}">${money(total)}</div>${changeChip(total, prev, S.sumType==='expense')}</div></div>
  ${bd.length ? `<div class="list">${bd.map(b => `
    <button class="row" data-act="drill" data-id="${b.cat.id}">
      <span class="ico ringed" style="--c:${b.cat.color}">${b.cat.icon}</span>
      <span class="grow"><span class="name">${esc(b.cat.name)}<span class="badge">${b.n}</span></span></span>
      <span class="right"><div class="amt">${money(b.v)}</div><span class="pct">${(b.v/total*100).toFixed(1)}%</span></span>
    </button>`).join('')}</div>` : emptyCard(S.sumType)}`;
}
function emptyCard(type){
  const inc = type === 'income';
  const cur = (() => { const r = range(S.period, S.anchor), now = new Date(); return now >= r.start && now < r.end; })();
  return `<div class="card emptycard"><div class="em">${inc ? '💰' : '🧾'}</div>
    <div class="t">No ${inc ? 'income' : 'spending'} ${cur ? { day:'today', week:'this week', month:'this month' }[S.period] : 'in this period'}</div>
    <div class="d">${cur ? `Log one with the + button, or triple-tap the back of your iPhone.` : 'Swipe or use the arrows to look at another period.'}</div>
    ${cur ? `<button class="btn primary" data-act="add" data-v="${inc ? 'income' : 'expense'}">Add ${inc ? 'income' : 'an expense'}</button>` : ''}</div>`;
}
function activityBars(r){
  const now = new Date(), list = txIn(r, 'expense'); let bars = [], labelEvery = 1;
  const mk = (lab, items, future, always) => { const bd = catBreakdown(items); return { label:lab, segs:bd.map(b => ({ v:b.v, c:b.cat.color })), total:sum(items), future, always }; };
  if (S.period === 'day'){
    for (let h = 0; h < 24; h++){ const s = new Date(r.start); s.setHours(h); bars.push(mk(String(h).padStart(2,'0'), list.filter(t => t._d.getHours() === h), s > now)); }
    labelEvery = 6;
  } else if (S.period === 'week'){
    for (let i = 0; i < 7; i++){ const d = addDays(r.start, i); bars.push(mk(WD[d.getDay()], list.filter(t => sod(t._d).getTime() === d.getTime()), d > now)); }
  } else {
    const days = Math.round((r.end - r.start) / 864e5);
    for (let i = 0; i < days; i++){ const d = addDays(r.start, i); const dn = i+1; bars.push(mk(String(dn), list.filter(t => t._d.getDate() === dn), d > now, dn === 1 || dn % 5 === 0 && dn < 30 || dn === days)); }
    labelEvery = 99;
  }
  const elapsed = bars.filter(b => !b.future);
  const avg = elapsed.length ? sum(elapsed.map(b => ({ amount:b.total }))) / elapsed.length : 0;
  return { bars, avg, labelEvery };
}
function txRow(t){
  const c = catById(t.categoryId), inc = t.type === 'income';
  return `<button class="row" data-act="tx" data-id="${esc(t.id)}"><span class="ico sq" style="--c:${c.color}">${c.icon}</span>

    <span class="amt ${inc?'inc':''}">${inc?'+':''}${money(t.amount, true)}</span></button>`;
}
function groupedList(list){
  if (!list.length) return '<div class="list"><div class="empty">No transactions in this period.<br><span style="font-size:13px">Tap + to add one.</span></div></div>';
  const groups = new Map();
  list.slice().sort((a, b) => b._d - a._d).forEach(t => { const k = dkey(t._d); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  return [...groups.values()].map(g => { const d = g[0]._d; const spent = sum(g.filter(t => t.type === 'expense'));
    return `<div class="dayhdr"><span>${WD[d.getDay()]}, ${d.getDate()} ${MONL[d.getMonth()]}</span><span>${money(spent, true)}</span></div><div class="list" style="margin-top:0">${g.map(txRow).join('')}</div>`; }).join('');
}
function viewActivity(r, pr){

}
function viewBudget(r){

    || '<div class="empty">No budget limits yet.</div>'}</div>

function viewAnalytics(r, pr){

function render(animate = true){

  const isCur = (() => { const now = new Date(); return now >= r.start && now < r.end; })();
  $('plabel').innerHTML = esc(label(S.period, r)) + (isCur ? '' : `<small>↩ ${{ day:'Today', week:'This week', month:'This month' }[S.period]}</small>`);

      q('#ceChip').style.setProperty('--c', c.color); q('#ceChipIco').textContent = ic; q('#ceChipName').textContent = c.name.trim() || 'New category';
      q('#ceEmoji').placeholder = ic;
      body.querySelectorAll('[data-emo]').forEach(x => x.classList.toggle('on', x.dataset.emo === c.icon));
      body.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x.dataset.col === c.color.toUpperCase()));
      const cu = q('#ceCustom'), isCustom = !PALETTE.includes(c.color.toUpperCase()); cu.classList.toggle('on', isCustom); cu.style.background = isCustom ? c.color : '';
    };
    const nameEl = q('#ceName'); nameEl.oninput = () => { c.name = nameEl.value; msg.textContent = ''; refresh(); };
    const limEl = q('#ceLimit'); if (limEl) limEl.oninput = () => c.limit = Math.max(0, parseFloat(String(limEl.value).replace(/\s/g,'').replace(',', '.')) || 0);
    body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { c.type = b.dataset.k; c.name = nameEl.value; draw(body); });
    body.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { c.color = b.dataset.col; refresh(); });
    const colEl = q('#ceColor'); colEl.oninput = colEl.onchange = () => { if (/^#[0-9a-f]{6}$/i.test(colEl.value)){ c.color = colEl.value.toUpperCase(); refresh(); } };
    const emoEl = q('#ceEmoji'); emoEl.oninput = () => { const g = firstGlyph(emoEl.value); c.icon = g; iconTouched = !!g; if (emoEl.value !== g) emoEl.value = g; refresh(); };
    body.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => { c.icon = b.dataset.emo; iconTouched = true; emoEl.value = c.icon; refresh(); });
    q('#ceSave').onclick = () => {
      c.name = nameEl.value.trim();
      if (!c.name){ nameEl.focus(); msg.textContent = 'Give it a name.'; return; }
      if (categories.some(x => x.id !== c.id && x.type === c.type && x.name.toLowerCase() === c.name.toLowerCase())){ msg.textContent = `You already have a${c.type === 'income' ? 'n income' : 'n expense'} category called “${c.name}”.`; nameEl.focus(); return; }
      c.icon = icon(); if (c.type !== 'expense') c.limit = 0;
      if (isNew){ const at = categories.findIndex(x => x.id === fallbackCat(c.type)); categories.splice(at < 0 ? categories.length : at, 0, c); } else Object.assign(categories.find(x => x.id === c.id), c);
      saveCats(); TX = allTx(); render(false); toast(isNew ? `${c.icon} ${c.name} created` : 'Saved');
      if (opts.onSaved){ opts.onSaved(c); } else closeSheet();
    };
    const del = q('#ceDel');
    if (del) del.onclick = () => {
      if (!armed){ armed = true; del.classList.add('arm'); del.textContent = 'Tap again to delete'; setTimeout(() => { armed = false; del.classList.remove('arm'); del.textContent = 'Delete category'; }, 3000); return; }
      categories = categories.filter(x => x.id !== c.id);
      if (!isRemote()){ userTx.forEach(t => { if (t.categoryId === c.id) t.categoryId = fallbackCat(c.type); }); store.set(CONFIG.STORAGE_KEYS.userTx, userTx); }
      saveCats(); TX = allTx(); closeSheet(); render(false); toast('Deleted · moved to ' + catById(fallbackCat(c.type)).name);
    };
  };
  openSheet(isNew ? (opts.onSaved ? `New ${c.type} category` : 'New category') : 'Edit category', '', draw);
}

function addSheet(preset = {}){
  const now = new Date(), p = x => String(x).padStart(2,'0');
  const st = { type:preset.type === 'income' ? 'income' : 'expense', cat:preset.cat || null };
  const draw = body => {
    const cats = categories.filter(c => c.type === st.type);
    if (!cats.find(c => c.id === st.cat)) st.cat = cats[0] && cats[0].id;
    const keep = id => (body.querySelector('#' + id) || {}).value;
    const amt = keep('atAmt') || preset.amt || '', note = keep('atNote') || preset.note || '', dt = keep('atDate') || preset.dt || `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`;
    body.innerHTML = `
      <div class="seg" style="display:flex;margin:4px 0 0"><button style="flex:1" data-t="expense" class="${st.type==='expense'?'on':''}">Expense</button><button style="flex:1" data-t="income" class="${st.type==='income'?'on':''}">Income</button></div>
      <label class="f" for="atAmt">Amount (${CONFIG.CURRENCY_SYMBOL})</label><input class="inp amtinp" id="atAmt" type="text" inputmode="decimal" placeholder="0.00" value="${esc(amt)}" autocomplete="off">
      <label class="f">Category</label><div class="chips">${cats.map(c => `<button class="chip ${c.id===st.cat?'on':''}" data-c="${c.id}" style="--c:${c.color}"><span>${c.icon}</span>${esc(c.name)}</button>`).join('')}<button class="chip add" id="atNewCat">+ New category</button></div>
      <label class="f" for="atNote">Note</label><input class="inp" id="atNote" maxlength="40" placeholder="e.g. Woolworths" value="${esc(note)}" autocomplete="off">
      <label class="f" for="atDate">Date &amp; time</label><input class="inp" id="atDate" type="datetime-local" value="${dt}">
      <div class="btnrow"><button class="btn primary" id="atSave">Add ${st.type}</button></div>
      <div class="note">${isRemote() ? 'Saved to your Geld cloud store' + (navigator.onLine ? '' : ' when you are back online') + '.' : 'Sample mode — saved on this device only. Connect sync with the gear icon.'}</div>`;
    body.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { st.type = b.dataset.t; draw(body); });
    body.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { st.cat = b.dataset.c; body.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
    body.querySelector('#atNewCat').onclick = () => {
      const back = { type:st.type, amt:body.querySelector('#atAmt').value, note:body.querySelector('#atNote').value, dt:body.querySelector('#atDate').value };
      catEditor(null, { type:st.type, onSaved:cat => addSheet(Object.assign(back, { cat:cat.id })) });
    };
    body.querySelector('#atSave').onclick = () => {
      const v = parseFloat(String(body.querySelector('#atAmt').value).replace(/\s/g,'').replace(',', '.'));
      if (!(v > 0)){ body.querySelector('#atAmt').focus(); toast('Enter an amount'); return; }
      const d = body.querySelector('#atDate').value || dt;
      const tx = { id:'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), date:d.slice(0,16), amount:Math.round(v*100)/100, categoryId:st.cat || fallbackCat(st.type), note:body.querySelector('#atNote').value.trim(), type:st.type };
      if (isRemote()) enqueue({ op:'addTx', tx }); else { userTx.push(tx); store.set(CONFIG.STORAGE_KEYS.userTx, userTx); }
      TX = allTx(); closeSheet(); render(false); toast('Added ' + money(v, true));
    };
  };
  openSheet('Add transaction', '', draw);
}

function txSheet(id){
  const t = TX.find(x => x.id === id); if (!t) return;
  const c = catById(t.categoryId), inc = t.type === 'income', canDel = isRemote() || userTx.some(u => u.id === id);
  const pending = isRemote() && queue.some(q => q.op === 'addTx' && q.tx.id === id);
  let armed = false;
  openSheet(inc ? 'Income' : 'Expense', `
    <div style="display:flex;align-items:center;gap:12px;margin:6px 0 10px"><span class="ico ringed" style="--c:${c.color};width:52px;height:52px;font-size:24px">${c.icon}</span>
      <div><div class="amt ${inc?'inc':''}" style="font-size:28px;text-align:left">${inc?'+':''}${money(t.amount, true)}</div><div class="meta">${esc(c.name)}</div></div></div>
    <div class="card" style="margin-top:0;padding:6px 14px">
      <div class="kv"><span>Date</span><span>${WD[t._d.getDay()]}, ${t._d.getDate()} ${MONL[t._d.getMonth()]} ${t._d.getFullYear()} · ${fmtTime(t._d)}</span></div>
      <div class="kv"><span>Note</span><span>${esc(t.note || '—')}</span></div>
      ${pending ? '<div class="kv"><span>Status</span><span>Waiting to sync</span></div>' : ''}</div>
    ${canDel ? '<div class="btnrow"><button class="btn danger" id="txDel">Delete transaction</button></div>' : '<div class="note">Sample transactions can’t be deleted. Connect sync to use your real data.</div>'}`,
  body => { const del = body.querySelector('#txDel'); if (!del) return;
    del.onclick = () => {
      if (!armed){ armed = true; del.classList.add('arm'); del.textContent = 'Tap again to delete'; setTimeout(() => { armed = false; del.classList.remove('arm'); del.textContent = 'Delete transaction'; }, 3000); return; }
      if (isRemote()){
        const qi = queue.findIndex(q => q.op === 'addTx' && q.tx.id === id);
        if (qi >= 0){ queue.splice(qi, 1); saveQueue(); } else enqueue({ op:'delTx', id });
      } else { userTx = userTx.filter(u => u.id !== id); store.set(CONFIG.STORAGE_KEYS.userTx, userTx); }
      TX = allTx(); closeSheet(); render(false); toast('Transaction deleted');
    }; });
}

/* ============================ CLOUD SYNC ============================ */
const SY = { busy:false, status:'', err:'', timer:null };
function saveQueue(){ store.set(CONFIG.STORAGE_KEYS.queue, queue); }
function enqueue(item){
  if (item.op === 'putCats') queue = queue.filter(q => q.op !== 'putCats'); // only the latest full category list matters
  queue.push(item); saveQueue(); updateSyncUI(); sync();
}
async function api(method, path, body){
  const c = syncCfg();
  const res = await fetch(c.url.replace(/\/+$/, '') + path, { method, cache:'no-store',
    headers:Object.assign({ 'Authorization':'Bearer ' + c.key }, body ? { 'Content-Type':'application/json' } : {}),
    body:body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch(e){}
  if (!res.ok){ const e = new Error((data && data.error) || ('HTTP ' + res.status)); e.status = res.status; throw e; }
  return data;
}
async function flushQueue(){
  while (queue.length){
    const q = queue[0];
    try {
      if (q.op === 'addTx') await api('POST', '/transactions', q.tx);
      else if (q.op === 'delTx') await api('DELETE', '/transactions/' + encodeURIComponent(q.id));
      else if (q.op === 'putCats') await api('PUT', '/categories', { categories:q.categories });
    } catch(e){
      if (e.status === 404 && q.op === 'delTx'){} // already gone
      else if (e.status && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 408 && e.status !== 429){ console.warn('Geld: dropped rejected change', q.op, e.message); }
      else throw e; // offline / auth / server error: keep the queue and retry later
    }
    queue.shift(); saveQueue();
  }
}
async function sync(opts = {}){
  if (!isRemote()) return;
  if (SY.busy){ SY.again = true; return; }
  SY.busy = true; SY.again = false; SY.err = ''; updateSyncUI();
  try {
    await flushQueue();
    const st = await api('GET', '/state');
    cache = { categories:st.categories || [], transactions:st.transactions || [], updatedAt:st.updatedAt || null, syncedAt:new Date().toISOString() };
    store.set(CONFIG.STORAGE_KEYS.cache, cache);
    categories = normCats(cache.categories); TX = allTx();
    if (!$('sheet').classList.contains('open') || opts.force) render(false);
    if (opts.toast) toast('Synced');
  } catch(e){
    SY.err = e.status === 401 ? 'Key rejected — check Settings' : (navigator.onLine === false || !e.status) ? 'Offline' : ('Sync error: ' + e.message);
    if (opts.toast) toast(SY.err);
  } finally {
    SY.busy = false; updateSyncUI();
    clearTimeout(SY.timer); if (queue.length && isRemote()) SY.timer = setTimeout(sync, 30000); // retry pending changes
    if (opts.after) opts.after();
    if (SY.again) setTimeout(sync, 0);
  }
}
function ago(iso){
  if (!iso) return 'never'; const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 45) return 'just now'; if (s < 3600) return Math.round(s/60) + ' min ago';
  const sameDay = sod(d).getTime() === sod(new Date()).getTime();
  return (sameDay ? '' : `${d.getDate()} ${MON[d.getMonth()]} `) + fmtTime(d);
}
function updateSyncUI(){
  const remote = isRemote(), sb = $('syncBtn'), sub = $('subtitle');
  sb.hidden = !remote; sb.classList.toggle('spin', SY.busy);
  if (!remote) sub.innerHTML = '<span class="samplebadge">Sample data</span>';
  else {
    const cls = SY.err ? (SY.err === 'Offline' ? 'warn' : 'err') : queue.length ? 'warn' : '';
    const txt = SY.busy ? 'Syncing…' : SY.err ? SY.err : queue.length ? `${queue.length} pending` : 'Synced ' + ago(cache && cache.syncedAt);
    sub.innerHTML = `<span class="syncdot ${cls}"></span>${esc(txt)}`;
  }
  const ss = document.getElementById('setStatus'); if (ss) ss.innerHTML = settingsStatus();
}
function settingsStatus(){
  if (!isRemote()) return '<div class="kv"><span>Mode</span><span>Sample data (not connected)</span></div>';
  return `<div class="kv"><span>Last synced</span><span>${cache && cache.syncedAt ? ago(cache.syncedAt) : 'never'}</span></div>
    <div class="kv"><span>Server updated</span><span>${cache && cache.updatedAt ? ago(cache.updatedAt) : '—'}</span></div>
    <div class="kv"><span>Pending changes</span><span>${queue.length}</span></div>
    <div class="kv"><span>Status</span><span>${SY.busy ? 'Syncing…' : esc(SY.err || 'OK')}</span></div>`;
}
function settingsSheet(){
  const c = syncCfg() || {};
  openSheet('Sync settings', `
    <div class="meta" style="white-space:normal;margin-top:2px">Connect Geld to your private cloud store so the app and your Back Tap shortcut share the same data.</div>
    <label class="f" for="setUrl">API URL</label><input class="inp" id="setUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" value="${esc(c.url || CONFIG.API_URL_DEFAULT)}">
    <label class="f" for="setKey">Key</label><input class="inp" id="setKey" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="${c.key ? 'Saved — leave blank to keep' : 'Your Geld passphrase'}">
    <div class="btnrow"><button class="btn primary" id="setSave">${c.key ? 'Save & sync' : 'Connect'}</button></div>
    <div class="stline" id="setMsg"></div>
    <div class="card" style="padding:6px 14px" id="setStatus">${settingsStatus()}</div>
    ${isRemote() ? '<div class="btnrow"><button class="btn" id="setSync">Sync now</button></div><div class="btnrow"><button class="btn danger" id="setOff">Disconnect (show sample data)</button></div>' : ''}
    <div class="note">The key is stored only on this device. Data shown when not connected is synthetic sample data.</div>`,
  body => {
    const msg = body.querySelector('#setMsg');
    body.querySelector('#setSave').onclick = async () => {
      const url = body.querySelector('#setUrl').value.trim().replace(/\/+$/, ''), key = body.querySelector('#setKey').value.trim() || c.key;
      if (!/^https?:\/\//.test(url)){ msg.textContent = 'Enter the full API URL (https://…)'; return; }
      if (!key){ msg.textContent = 'Enter your key'; return; }
      msg.textContent = 'Checking…';
      try {
        const r = await fetch(url + '/state', { headers:{ 'Authorization':'Bearer ' + key }, cache:'no-store' });
        if (r.status === 401){ msg.textContent = 'That key was rejected.'; return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } catch(e){ msg.textContent = 'Could not reach the API (' + e.message + ').'; return; }
      const wasRemote = isRemote();
      store.set(CONFIG.STORAGE_KEYS.sync, { url, key });
      body.querySelector('#setKey').value = '';
      if (!wasRemote){ queue = []; saveQueue(); cache = null; }
      msg.textContent = 'Connected.';
      sync({ force:true, after:() => { closeSheet(); toast('Connected · showing your data'); } });
    };
    const sn = body.querySelector('#setSync'); if (sn) sn.onclick = () => sync({ toast:true });
    const off = body.querySelector('#setOff'); let armed = false;
    if (off) off.onclick = () => {
      if (!armed){ armed = true; off.classList.add('arm'); off.textContent = 'Tap again to disconnect'; setTimeout(() => { armed = false; off.classList.remove('arm'); off.textContent = 'Disconnect (show sample data)'; }, 3000); return; }
      localStorage.removeItem(CONFIG.STORAGE_KEYS.sync); localStorage.removeItem(CONFIG.STORAGE_KEYS.cache); queue = []; saveQueue(); cache = null;
      categories = localCats; TX = allTx(); closeSheet(); render(false); updateSyncUI(); toast('Disconnected · sample data');
    };
  });
}

/* ============================ EVENTS ============================ */
document.querySelectorAll('.seg button[data-p]').forEach(b => b.onclick = () => { S.period = b.dataset.p; S.anchor = new Date(); render(); });
$('prev').onclick = () => { S.anchor = shift(S.period, S.anchor, -1); render(); };
$('next').onclick = () => { S.anchor = shift(S.period, S.anchor, 1); render(); };
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
$('fab').onclick = () => addSheet();
$('plabel').onclick = () => { S.anchor = new Date(); render(); };
// hide the + button while scrolling down through a list so it never sits on top of row amounts; bring it back on scroll up
(() => { let last = 0; main.addEventListener('scroll', () => { const y = main.scrollTop, fab = $('fab');
  if (y > last + 6 && y > 80) fab.classList.add('away'); else if (y < last - 6 || y < 40) fab.classList.remove('away');
  last = y; }, { passive:true }); })();
// swipe the sheet down by its handle/title to close it
(() => { const sh = $('sheet'); let y0 = null, dy = 0;
  sh.querySelectorAll('.grab,.sh').forEach(h => {
    h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive:true });
    h.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translate3d(0,${dy}px,0)`; }, { passive:true });
    h.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) closeSheet(); }, { passive:true });
  }); })();
$('gearBtn').onclick = settingsSheet;
$('syncBtn').onclick = () => sync({ toast:true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ updateSyncUI(); sync(); } });
window.addEventListener('online', () => sync());
setInterval(updateSyncUI, 60000);
// pull-to-refresh (when connected): pull down from the top of the content
(() => { let y0 = null, dy = 0; const ptr = $('ptr');
  main.addEventListener('touchstart', e => { y0 = (isRemote() && main.scrollTop <= 0) ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  main.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0);
    const p = Math.min(dy, 110); ptr.style.transition = 'none'; ptr.style.opacity = Math.min(1, p/70); ptr.style.transform = `translate3d(0,${p*0.5 - 30}px,0) rotate(${p*3}deg)`; }, { passive:true });
  main.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; ptr.style.transition = 'transform .25s, opacity .25s';
    if (dy > 75){ ptr.classList.add('go'); ptr.style.transform = 'translate3d(0,16px,0)'; sync({ toast:true, after:() => { ptr.classList.remove('go'); ptr.style.opacity = 0; ptr.style.transform = ''; } }); }
    else { ptr.style.opacity = 0; ptr.style.transform = ''; } dy = 0; }, { passive:true });
})();
$('overlay').onclick = closeSheet; $('sheetClose').onclick = closeSheet;
let resetArmed = false;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'add') addSheet({ type:el.dataset.v });
  else if (a === 'sumType'){ S.sumType = el.dataset.v; render(false); }
  else if (a === 'sort'){ S.sort = { amount:'count', count:'name', name:'amount' }[S.sort]; render(false); }
  else if (a === 'drill') drill(id);
  else if (a === 'tx'){ if ($('sheet').classList.contains('open')){ closeSheet(); setTimeout(() => txSheet(id), 260); } else txSheet(id); }
  else if (a === 'editCat'){ if ($('sheet').classList.contains('open')){ closeSheet(); setTimeout(() => catEditor(id), 260); } else catEditor(id); }
  else if (a === 'newCat') catEditor(null);
  else if (a === 'resetCats'){
    if (!resetArmed){ resetArmed = true; el.classList.add('arm'); el.textContent = 'Tap again to reset'; setTimeout(() => { resetArmed = false; el.classList.remove('arm'); el.textContent = 'Reset to defaults'; }, 3000); return; }
    resetArmed = false; categories = clone(DEFAULT_CATEGORIES); saveCats(); TX = allTx(); render(false); toast('Categories reset');
  }
});
// swipe left/right on the content to move between periods
let sx = null, sy = null;
main.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
main.addEventListener('touchend', e => { if (sx === null || S.tab === 'categories') return; if (!e.changedTouches.length) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){ if (dx > 0) $('prev').click(); else if (!$('next').disabled) $('next').click(); } }, { passive:true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.GeldApp = { S, render, go, drill, catEditor, addSheet, closeSheet, settingsSheet, txSheet, sync, isRemote, get categories(){ return categories; }, get queue(){ return queue; }, get tx(){ return TX; } };
render(); updateSyncUI(); sync();
</script>
<script>
/* Offline support: register the service worker (relative path so it works under /<repo>/ on GitHub Pages). */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).catch(e => console.warn('SW registration failed', e)));
}
</script>
