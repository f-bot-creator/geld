<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geld">
<meta name="theme-color" content="#0c0e12">
<meta name="format-detection" content="telephone=no">
<title>Geld</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#0c0e12; --bg2:#12151b; --card:#181c23; --card2:#1f242d; --line:#ffffff12;
  --text:#f3f5f8; --muted:#9aa3b2; --faint:#6b7483;
  --accent:#2ec4b6; --accent2:#7c6cff; --good:#3ddc97; --bad:#ff6b6b; --warn:#ffca3a;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --tabh:64px; --colw:min(430px,100vw);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%;overscroll-behavior:none}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;font-size:16px;color:var(--text)}
.app{position:relative;width:var(--colw);margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 50% at 50% 0%,#17303a 0%,var(--bg) 60%);overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px #ffffff10,0 30px 80px #0008}}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 calc(16px + var(--sar)) calc(var(--tabh) + var(--sab) + 96px) calc(16px + var(--sal))}
.scroller::-webkit-scrollbar{display:none}
header.top{padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) 8px calc(16px + var(--sal));
  position:relative;z-index:5;background:linear-gradient(#0c0e12f0,#0c0e1200)}
.brand{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:750;display:flex;align-items:center;gap:8px}
.brand h1 .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) 0 35%,#ff9f1c 0 55%,var(--accent2) 0 80%,#ff5d8f 0);
  -webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
.brand .sub{color:var(--muted);font-size:13px}
.periodbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{min-height:38px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.seg button.on{background:var(--text);color:#0c0e12}
.nav{display:flex;align-items:center;flex:1;justify-content:flex-end;gap:2px;min-width:0}
.nav .lbl{font-weight:650;font-size:13.5px;letter-spacing:-.01em;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .iconbtn{width:40px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.iconbtn:active{background:#ffffff14}
.iconbtn:disabled{opacity:.25}
.view{animation:enter .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);padding:14px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.pill.on{background:#2ec4b622;border-color:#2ec4b688;color:#bff5ef}
.donutwrap{position:relative;margin:6px auto 0;width:min(300px,78vw);aspect-ratio:1}
.donutwrap svg{width:100%;height:100%;display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.center .k{color:var(--muted);font-size:14px}
.center .v{font-size:38px;font-weight:780;letter-spacing:-.03em;margin:2px 0}
.center .v.sm{font-size:30px}
.chg{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:650;padding:3px 9px;border-radius:999px}
.chg.up{color:#ffb3b3;background:#ff6b6b22}.chg.down{color:#a6f5cf;background:#3ddc9722}.chg.flat{color:var(--muted);background:#ffffff10}
.chg.good{color:#a6f5cf;background:#3ddc9722}.chg.bad{color:#ffb3b3;background:#ff6b6b22}
.list{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);margin-top:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:60px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row:active{background:#ffffff08}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;position:relative}
.ico.ringed{box-shadow:inset 0 0 0 2.5px var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.ico.sq{border-radius:12px;background:color-mix(in srgb,var(--c) 20%,#ffffff06)}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:7px;background:#ffffff12;color:var(--muted);font-size:11.5px;font-weight:700;margin-left:6px;vertical-align:1px}
.amt{font-weight:680;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt.inc{color:var(--good)}
.pct{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:650;color:var(--muted);background:#ffffff0d;border-radius:7px;padding:1px 6px}
.right{text-align:right;flex:none}
.dayhdr{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;margin:18px 4px 6px}
.empty{color:var(--faint);text-align:center;padding:26px 10px;font-size:14px}
.hero{text-align:center;margin-top:8px}
.hero .k{color:var(--muted);font-size:14px}
.hero .v{font-size:36px;font-weight:780;letter-spacing:-.03em}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-size:10.5px;fill:var(--faint);font-family:inherit}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat .k{color:var(--muted);font-size:12.5px}.stat .v{font-size:20px;font-weight:720;margin-top:2px;font-variant-numeric:tabular-nums}
.ringbox{position:relative;display:grid;place-items:center;flex:none}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%}
.ringbox .in{position:relative;font-size:18px;text-align:center}
.dash{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.bigring{width:min(290px,76vw);height:min(290px,76vw);margin:8px auto 0}
.bigring .in .v{font-size:36px;font-weight:780;letter-spacing:-.03em}
.bigring .in .k{color:var(--muted);font-size:14px}
.note{color:var(--faint);font-size:12.5px;text-align:center;margin-top:8px}
.btn{min-height:50px;border-radius:var(--r-md);padding:0 18px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--text);color:#0c0e12;border-color:transparent}
.btn.danger{color:#ffb3b3;background:#ff6b6b18;border-color:#ff6b6b40}
.btn.danger.arm{background:#ff6b6b;color:#1a0505}
.btnrow{display:flex;gap:10px;margin-top:14px}
.link{color:var(--accent);font-weight:650;min-height:44px;padding:0 4px}
/* tab bar & fab */
nav.tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:6px calc(10px + var(--sar)) calc(6px + var(--sab)) calc(10px + var(--sal));
  background:linear-gradient(#0c0e1200,#0c0e12 30%)}
.tabsin{display:flex;background:#1a1e26e6;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;height:var(--tabh);padding:5px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);border-radius:20px;min-width:44px;transition:color .2s,background .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text);background:#ffffff12}
.fab{position:absolute;right:calc(18px + var(--sar));bottom:calc(var(--tabh) + var(--sab) + 26px);z-index:21;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#3be0cf,#7c6cff);color:#06120f;display:grid;place-items:center;box-shadow:0 10px 30px #2ec4b655,0 2px 6px #0007;transition:transform .15s}
.fab:active{transform:scale(.92)}
/* sheets */
.overlay{position:absolute;inset:0;z-index:40;background:#000a;opacity:0;transition:opacity .25s;pointer-events:none}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - var(--sat) - 24px);display:flex;flex-direction:column;
  background:var(--bg2);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translate3d(0,105%,0);transition:transform .34s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet.open{transform:translate3d(0,0,0)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#ffffff30;margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 18px;flex:none}
.sheet .sh h2{margin:0;font-size:18px}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px calc(18px + var(--sab))}
label.f{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:14px 2px 6px}
.inp{width:100%;min-height:50px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:#2ec4b6aa}
.amtinp{font-size:34px !important;font-weight:760;text-align:center;min-height:68px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.grid button{height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px}
.grid button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--text) inset}
.sw{width:100%;height:48px;border-radius:14px;border:3px solid transparent}
.sw.on{border-color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px 0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.chip.on{background:color-mix(in srgb,var(--c) 26%,var(--card));border-color:var(--c)}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 0;color:var(--muted);font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 14px);z-index:60;transform:translate3d(-50%,-80px,0);background:var(--text);color:#0c0e12;font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;font-size:14px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate3d(-50%,0,0)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1><span class="dot"></span>Geld</h1><span class="sub" id="subtitle"></span></div>
    <div class="periodbar" id="periodbar">
      <div class="seg" role="tablist" aria-label="Period">
        <button data-p="day">Daily</button><button data-p="week">Weekly</button><button data-p="month">Monthly</button>
      </div>
      <div class="nav">
        <button class="iconbtn" id="prev" aria-label="Previous period"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="lbl" id="plabel"></div>
        <button class="iconbtn" id="next" aria-label="Next period"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </header>
  <main class="scroller" id="main"></main>
  <button class="fab" id="fab" aria-label="Add transaction"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabs"><div class="tabsin" id="tabs"></div></nav>
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sb" id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
'use strict';
/* ========================= CONFIG ========================= */
const CONFIG = {
  CURRENCY_SYMBOL: 'R',        // change to '$', '€', etc.
  THOUSANDS_SEP: '\u00A0',      // non-breaking space → "R 7 608"
  DECIMAL_SEP: '.',
  WEEK_STARTS_MONDAY: true,
  STORAGE_KEYS: { categories: 'geld.categories.v1', userTx: 'geld.userTx.v1' }
};
const PALETTE = ['#7C6CFF','#2EC4B6','#FF9F1C','#FF5D8F','#3A86FF','#8AC926','#FFCA3A','#C77DFF','#06D6A0','#EF476F','#4CC9F0','#F4A261','#B5838D','#90A4AE'];
const EMOJIS = ['🏠','🛒','🍔','☕','🍕','🍷','🚗','⛽','🚌','✈️','💡','💧','📱','🌐','💊','🏥','💪','🎬','🎮','🎵','📚','🎓','🛍️','👕','💇','🧹','🐶','👶','🎁','🔁','🧾','🏦','💼','🧑‍💻','💸','📈','📦','⚽','🌿','❓'];

/* ===================== DEFAULT CATEGORIES ===================== */
// limit = monthly budget in rands (0 = no limit). kind decides where it shows in the add sheet.
const DEFAULT_CATEGORIES = [
  { id:'housing',   name:'Housing',       icon:'🏠', color:'#7C6CFF', limit:10000, kind:'expense' },
  { id:'groceries', name:'Groceries',     icon:'🛒', color:'#2EC4B6', limit:5000,  kind:'expense' },
  { id:'eating',    name:'Eating out',    icon:'🍔', color:'#FF9F1C', limit:2000,  kind:'expense' },
  { id:'transport', name:'Transport',     icon:'⛽', color:'#3A86FF', limit:3000,  kind:'expense' },
  { id:'utilities', name:'Utilities',     icon:'💡', color:'#FFCA3A', limit:2500,  kind:'expense' },
  { id:'phone',     name:'Airtime & data',icon:'📱', color:'#4CC9F0', limit:400,   kind:'expense' },
  { id:'health',    name:'Health',        icon:'💊', color:'#06D6A0', limit:1200,  kind:'expense' },
  { id:'fun',       name:'Entertainment', icon:'🎬', color:'#FF5D8F', limit:1000,  kind:'expense' },
  { id:'shopping',  name:'Shopping',      icon:'🛍️', color:'#C77DFF', limit:1500,  kind:'expense' },
  { id:'subs',      name:'Subscriptions', icon:'🔁', color:'#F4A261', limit:500,   kind:'expense' },
  { id:'salary',    name:'Salary',        icon:'💼', color:'#8AC926', limit:0,     kind:'income'  },
  { id:'freelance', name:'Freelance',     icon:'🧑‍💻', color:'#06D6A0', limit:0,   kind:'income'  },
  { id:'uncat',     name:'Uncategorised', icon:'❓', color:'#90A4AE', limit:0,     kind:'expense', locked:true }
];

/* ============================================================================
   SAMPLE DATA — REPLACE LATER
   Each transaction: { id, date:'YYYY-MM-DDTHH:mm' (local time), amount:Number (positive rands),
                       categoryId, note, type:'expense'|'income' }
   To use real data, set SAMPLE_DATA.transactions = yourArray (same shape).
   The generator below creates ~3 months of realistic synthetic data ending today.
   ============================================================================ */
function generateSampleTransactions(){
  let seed = 20261102;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd()*a.length)];
  const between = (a,b) => Math.round((a + rnd()*(b-a))*100)/100;
  const out = []; let n = 0;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-3, now.getDate());
  const add = (d, h, m, amount, categoryId, note, type='expense') => {
    const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
    if (dt > now) return;
    const p = x => String(x).padStart(2,'0');
    out.push({ id:'s'+(++n), date:`${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(h)}:${p(m)}`,
      amount, categoryId, note, type });
  };
  for (let d = new Date(start); d <= now; d.setDate(d.getDate()+1)) {
    const dom = d.getDate(), dow = d.getDay(), M = () => Math.floor(rnd()*60);
    if (dom === 1)  add(d, 8, 5, 9500, 'housing', 'Rent');
    if (dom === 2)  add(d, 6, 30, 549, 'health', 'Gym membership');
    if (dom === 3)  add(d, 9, 0, 899, 'utilities', 'Fibre internet');
    if (dom === 5)  add(d, 10, 12, 299, 'phone', 'Data bundle');
    if (dom === 7)  add(d, 0, 15, 199, 'subs', 'Streaming service');
    if (dom === 12) add(d, 0, 20, 69.99, 'subs', 'Music streaming');
    if (dom === 15) add(d, 11, 40, between(380,520), 'utilities', 'Water & rates');
    if (dom === 25) add(d, 7, 0, 32000, 'salary', 'Salary', 'income');
    if (dom === 18 && rnd() < .9) add(d, 16, 0, between(2000,6500), 'freelance', 'Freelance invoice', 'income');
    if (dom % 9 === 0) add(d, 18, M(), between(500,800), 'utilities', 'Prepaid electricity');
    // groceries ~3x/week
    if (rnd() < .42) add(d, 9+Math.floor(rnd()*10), M(), between(dow===6?600:120, dow===6?1600:650), 'groceries', pick(['Checkers','Woolworths Food','Pick n Pay','Spar','Food Lover\'s Market']));
    // eating out
    if (rnd() < (dow===5||dow===6 ? .65 : .3)) add(d, pick([7,8,12,13,19,20]), M(), between(45,480), 'eating', pick(['Coffee','Nando\'s','Sushi','Mugg & Bean','Takeaway pizza','Burger','Bakery']));
    // fuel weekly + rides
    if (dow === 1) add(d, 7, M(), between(650,950), 'transport', 'Fuel');
    if (rnd() < .12) add(d, pick([18,21,23]), M(), between(55,190), 'transport', 'Ride share');
    if (rnd() < .06) add(d, 14, M(), between(20,60), 'transport', 'Parking');
    if (rnd() < .08) add(d, 15, M(), between(150,1600), 'shopping', pick(['Takealot order','Clothing','Homeware','Hardware store']));
    if (rnd() < .07) add(d, 20, M(), between(90,420), 'fun', pick(['Cinema','Concert tickets','Bowling','Game purchase']));

function money(n, dec){
  const neg = n < 0; n = Math.abs(n);
  const s = dec ? n.toFixed(2) : String(Math.round(n));
  let [i, d] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, CONFIG.THOUSANDS_SEP);
  return (neg ? '−' : '') + CONFIG.CURRENCY_SYMBOL + '\u00A0' + i + (d ? CONFIG.DECIMAL_SEP + d : '');
}
function short(n){ return n >= 1000 ? CONFIG.CURRENCY_SYMBOL + (n/1000).toFixed(n >= 10000 ? 0 : 1).replace('.0','') + 'k' : CONFIG.CURRENCY_SYMBOL + Math.round(n); }
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sod = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const dkey = d => d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
function range(type, anchor){
  const a = sod(anchor);
  if (type === 'day') return { start:a, end:addDays(a,1) };
  if (type === 'week'){ const off = CONFIG.WEEK_STARTS_MONDAY ? (a.getDay()+6)%7 : a.getDay(); const s = addDays(a,-off); return { start:s, end:addDays(s,7) }; }
  return { start:new Date(a.getFullYear(), a.getMonth(), 1), end:new Date(a.getFullYear(), a.getMonth()+1, 1) };
}
function shift(type, anchor, dir){
  if (type === 'day') return addDays(anchor, dir);
  if (type === 'week') return addDays(anchor, 7*dir);
  return new Date(anchor.getFullYear(), anchor.getMonth()+dir, 1);
}
function label(type, r){
  const s = r.start, e = addDays(r.end,-1);
  if (type === 'day') return `${WD[s.getDay()]} ${s.getDate()} ${MON[s.getMonth()]}`;
  if (type === 'week') return s.getMonth() === e.getMonth() ? `${s.getDate()}–${e.getDate()} ${MON[e.getMonth()]}` : `${s.getDate()} ${MON[s.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]}`;
  return `${MON[s.getMonth()]} ${s.getFullYear()}`;
}
function centreLabel(type, r){
  const now = new Date(), cur = now >= r.start && now < r.end;
  if (cur) return { day:'Today', week:'This week', month:'This month' }[type];
  const prevR = range(type, shift(type, now, -1));
  if (+prevR.start === +r.start) return { day:'Yesterday', week:'Last week', month:'Last month' }[type];
  return label(type, r);
}

function changeChip(cur, prev, upIsBad = true){

  const cls = Math.abs(p) < 0.5 ? 'flat' : ((up === upIsBad) ? 'bad' : 'good');
  const arrow = up ? '▲' : '▼';

}

/* ============================ CHARTS (SVG) ============================ */
let uid = 0;
function donut(segs, opts = {}){
  const size = 300, stroke = opts.stroke || 26, r = (size - stroke)/2 - 2, C = 2*Math.PI*r;
  const total = segs.reduce((s, x) => s + x.v, 0);
  let out = `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="150" cy="150" r="${r}" fill="none" stroke="#ffffff0d" stroke-width="${stroke}"/>`;
  if (total > 0){
    const gap = segs.length > 1 ? stroke + 6 : 0; let acc = 0;
    segs.forEach(sg => {
      const len = sg.v / total * C, dash = Math.max(0.01, len - gap);
      out += `<circle class="dash" cx="150" cy="150" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="0 ${C}" data-dash="${dash} ${C}" stroke-dashoffset="${-(acc + gap/2)}" transform="rotate(-90 150 150)"/>`;
      acc += len;
    });
  }
  return out + '</svg>';
}
function ringSVG(frac, color, stroke, track = '#ffffff14', grad){
  const size = 100, r = (size - stroke)/2, C = 2*Math.PI*r, f = Math.max(0, Math.min(1, frac));
  const id = 'g' + (++uid);
  const defs = grad ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${grad[0]}"/><stop offset="1" stop-color="${grad[1]}"/></linearGradient></defs>` : '';
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${defs}<circle cx="50" cy="50" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    ${f > 0 ? `<circle class="dash" cx="50" cy="50" r="${r}" fill="none" stroke="${grad ? `url(#${id})` : color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="0 ${C}" data-dash="${f*C} ${C}" transform="rotate(-90 50 50)"/>` : ''}</svg>`;
}
// bars: [{label, segs:[{v,c}], total, future}]
function barChart(bars, { height = 190, avg = null, labelEvery = 1 } = {}){
  const W = 360, H = height, padL = 2, padR = 36, padT = 10, padB = 22, ch = H - padT - padB;
  const max = Math.max(1, ...bars.map(b => b.total), avg || 0) * 1.08;
  const n = bars.length, slot = (W - padL - padR) / n, bw = Math.max(3, Math.min(28, slot * .64));
  const id = ++uid;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">`;
  [0, .5, 1].forEach(f => { const y = padT + ch - f*ch/1.08;
    s += `<line x1="0" x2="${W-padR+4}" y1="${y}" y2="${y}" stroke="#ffffff0c"/><text x="${W}" y="${y+3.5}" text-anchor="end">${f ? short(max/1.08*f) : '0'}</text>`; });
  bars.forEach((b, i) => {
    const x = padL + i*slot + (slot - bw)/2;
    if (b.total <= 0){ s += `<rect x="${x}" y="${padT+ch-3}" width="${bw}" height="3" rx="1.5" fill="${b.future ? '#ffffff08' : '#ffffff16'}"/>`; }
    else {
      const h = b.total / max * ch; const rx = Math.min(bw/2, 6);
      s += `<clipPath id="c${id}_${i}"><rect x="${x}" y="${padT+ch-h}" width="${bw}" height="${h}" rx="${rx}"/></clipPath><g class="bar" clip-path="url(#c${id}_${i})" style="animation-delay:${Math.min(i*14,400)}ms">`;
      let y = padT + ch;
      b.segs.forEach(sg => { const hh = sg.v / max * ch; y -= hh; s += `<rect x="${x}" y="${y}" width="${bw}" height="${hh + .4}" fill="${sg.c}"/>`; });
      s += '</g>';
    }
    if (b.label && (i % labelEvery === 0 || b.always)) s += `<text x="${x + bw/2}" y="${H-6}" text-anchor="middle">${b.label}</text>`;
  });
  if (avg){ const y = padT + ch - avg/max*ch;
    s += `<line x1="0" x2="${W-padR+4}" y1="${y}" y2="${y}" stroke="#ffffffb0" stroke-width="1.2" stroke-dasharray="4 4"/>
      <rect x="${W-padR+5}" y="${y-8}" width="${padR-5}" height="16" rx="5" fill="#f3f5f8"/><text x="${W-padR/2+2.5}" y="${y+3.5}" text-anchor="middle" style="fill:#0c0e12;font-weight:700">${short(avg)}</text>`; }
  return s + '</svg>';
}
function pairChart(groups, { height = 190 } = {}){
  const W = 360, H = height, padT = 10, padB = 22, padR = 36, ch = H - padT - padB;
  const max = Math.max(1, ...groups.flatMap(g => [g.inc, g.exp])) * 1.08;
  const slot = (W - padR) / groups.length, bw = Math.min(18, slot*.3);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income vs expenses">`;
  [0, .5, 1].forEach(f => { const y = padT + ch - f*ch/1.08;
    s += `<line x1="0" x2="${W-padR+4}" y1="${y}" y2="${y}" stroke="#ffffff0c"/><text x="${W}" y="${y+3.5}" text-anchor="end">${f ? short(max/1.08*f) : '0'}</text>`; });
  groups.forEach((g, i) => {
    const cx = i*slot + slot/2;
    [[g.inc, '#3ddc97', cx - bw - 2], [g.exp, '#ff7a6b', cx + 2]].forEach(([v, c, x], k) => {
      const h = Math.max(v/max*ch, 3);
      s += `<rect class="bar" style="animation-delay:${i*40+k*20}ms" x="${x}" y="${padT+ch-h}" width="${bw}" height="${h}" rx="${Math.min(5,bw/2)}" fill="${v ? c : '#ffffff16'}" ${g.cur ? '' : 'opacity=".55"'}/>`;
    });
    s += `<text x="${cx}" y="${H-6}" text-anchor="middle" style="${g.cur ? 'fill:#f3f5f8;font-weight:700' : ''}">${g.label}</text>`;
  });
  return s + '</svg>';
}

  <div class="card"><h3>${title}</h3>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="donutwrap" style="width:150px;margin:0;flex:none">${donut(nz.map(s => ({ v:s.v, c:s.c })), { stroke:30 })}
        <div class="center"><div class="k" style="font-size:11px">Busiest</div><div style="font-weight:750;font-size:15px">${top ? top.l.split(' ')[0] : '—'}</div></div></div>
      <div style="flex:1;min-width:0">${segs.map(s => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;${s.v?'':'opacity:.45'}"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${s.c};margin-right:7px"></i>${s.l}</span><span class="amt" style="font-weight:600">${money(s.v)}</span></div>`).join('')}</div>
    </div></div>
  <div class="sectiontitle"><span>Biggest expenses</span></div>
  <div class="list">${biggest.length ? biggest.map(txRow).join('') : '<div class="empty">Nothing yet.</div>'}</div>`;
}
function viewCategories(){
  const sec = kind => categories.filter(c => c.kind === kind).map(c => `
    <button class="row" data-act="editCat" data-id="${c.id}"><span class="ico ringed" style="--c:${c.color}">${c.icon}</span>
      <span class="grow"><div class="name">${esc(c.name)}</div><div class="meta">${kind === 'expense' ? (c.limit ? money(c.limit) + ' / month' : 'No limit') : 'Income'}${c.locked ? ' · default' : ''}</div></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7483" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>`).join('');
  return `
  <div class="hero" style="text-align:left;margin:10px 4px 0"><div class="v" style="font-size:28px">Categories</div><div class="k">Tap one to rename, recolour, change its icon or set a monthly limit.</div></div>
  <div class="sectiontitle"><span>Expenses</span></div><div class="list">${sec('expense')}</div>
  <div class="sectiontitle"><span>Income</span></div><div class="list">${sec('income')}</div>
  <div class="btnrow"><button class="btn primary" data-act="newCat">+ New category</button></div>
  <div class="btnrow"><button class="btn danger" data-act="resetCats">Reset to defaults</button></div>`;
}

/* ============================ RENDER ============================ */
function render(animate = true){
  const r = range(S.period, S.anchor), pr = range(S.period, shift(S.period, S.anchor, -1));
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.p === S.period));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('plabel').textContent = label(S.period, r);
  $('next').disabled = r.end > new Date();
  $('periodbar').style.display = S.tab === 'categories' ? 'none' : '';
  $('subtitle').textContent = { summary:'Summary', activity:'Activity', budget:'Budget', analytics:'Analytics', categories:'Settings' }[S.tab];
  const html = { summary:viewSummary, activity:viewActivity, budget:viewBudget, analytics:viewAnalytics, categories:viewCategories }[S.tab](r, pr);
  main.innerHTML = `<div class="view${animate ? '' : ' still'}">${html}</div>`;
  animateDashes(main);
}
function go(tab){ if (S.tab !== tab){ S.tab = tab; main.scrollTop = 0; render(); } }

/* ============================ SHEETS ============================ */
let sheetOnClose = null;
function openSheet(title, html, mount){
  $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html; $('sheetBody').scrollTop = 0;
  $('overlay').classList.add('open'); $('sheet').classList.add('open');
  if (mount) mount($('sheetBody')); animateDashes($('sheetBody'));
}
function closeSheet(){ $('overlay').classList.remove('open'); $('sheet').classList.remove('open'); if (sheetOnClose){ sheetOnClose(); sheetOnClose = null; } }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

function drill(id){
  const c = catById(id), r = range(S.period, S.anchor);
  const list = txIn(r).filter(t => t.categoryId === c.id);
  openSheet(c.name, `
    <div style="display:flex;align-items:center;gap:12px;margin:6px 0 4px"><span class="ico ringed" style="--c:${c.color};width:52px;height:52px;font-size:24px">${c.icon}</span>
      <div><div style="font-size:26px;font-weight:760">${money(sum(list))}</div><div class="meta">${list.length} transaction${list.length===1?'':'s'} · ${label(S.period, r)}</div></div></div>
    ${groupedList(list)}
    <div class="btnrow"><button class="btn" data-act="editCat" data-id="${c.id}">Edit category</button></div>`);
}

function catEditor(id){
  const isNew = !id; const src = isNew ? { id:'c_' + Date.now().toString(36), name:'', icon:'📦', color:PALETTE[categories.length % PALETTE.length], limit:0, kind:'expense' } : catById(id);
  const c = clone(src); let armed = false;
  const draw = body => {
    body.innerHTML = `
      <div style="display:flex;justify-content:center;margin:4px 0 2px"><span class="ico ringed" id="cePrev" style="--c:${c.color};width:72px;height:72px;font-size:34px">${c.icon}</span></div>
      <label class="f" for="ceName">Name</label><input class="inp" id="ceName" maxlength="28" placeholder="e.g. Coffee" value="${esc(c.name)}" autocomplete="off">
      ${isNew ? `<label class="f">Type</label><div class="seg" style="display:inline-flex"><button data-k="expense" class="${c.kind==='expense'?'on':''}">Expense</button><button data-k="income" class="${c.kind==='income'?'on':''}">Income</button></div>` : ''}
      ${c.kind === 'expense' ? `<label class="f" for="ceLimit">Monthly budget limit (${CONFIG.CURRENCY_SYMBOL}) — 0 for none</label><input class="inp" id="ceLimit" type="number" inputmode="decimal" min="0" step="50" value="${c.limit || ''}" placeholder="0">` : ''}
      <label class="f">Colour</label><div class="grid">${PALETTE.map(p => `<button class="sw ${p===c.color?'on':''}" data-col="${p}" style="background:${p}" aria-label="Colour ${p}"></button>`).join('')}</div>
      <label class="f">Icon</label><div class="grid">${EMOJIS.map(e => `<button data-emo="${e}" class="${e===c.icon?'on':''}">${e}</button>`).join('')}</div>
      <div class="btnrow"><button class="btn primary" id="ceSave">${isNew ? 'Create category' : 'Save changes'}</button></div>
      ${!isNew && !c.locked ? `<div class="btnrow"><button class="btn danger" id="ceDel">Delete category</button></div><div class="note">Its transactions will move to “Uncategorised”.</div>` : ''}`;
    const nameEl = body.querySelector('#ceName'); nameEl.oninput = () => c.name = nameEl.value;
    const limEl = body.querySelector('#ceLimit'); if (limEl) limEl.oninput = () => c.limit = Math.max(0, parseFloat(limEl.value) || 0);
    body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { c.kind = b.dataset.k; draw(body); });
    body.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { c.color = b.dataset.col; body.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x === b)); body.querySelector('#cePrev').style.setProperty('--c', c.color); });
    body.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => { c.icon = b.dataset.emo; body.querySelectorAll('[data-emo]').forEach(x => x.classList.toggle('on', x === b)); body.querySelector('#cePrev').textContent = c.icon; });
    body.querySelector('#ceSave').onclick = () => {
      if (!c.name.trim()){ nameEl.focus(); toast('Give it a name'); return; }
      c.name = c.name.trim(); if (c.kind !== 'expense') c.limit = 0;
      if (isNew) categories.splice(categories.findIndex(x => x.id === 'uncat'), 0, c); else Object.assign(categories.find(x => x.id === c.id), c);
      saveCats(); TX = allTx(); closeSheet(); render(false); toast(isNew ? 'Category created' : 'Saved');
    };
    const del = body.querySelector('#ceDel');
    if (del) del.onclick = () => {
      if (!armed){ armed = true; del.classList.add('arm'); del.textContent = 'Tap again to delete'; setTimeout(() => { armed = false; del.classList.remove('arm'); del.textContent = 'Delete category'; }, 3000); return; }
      categories = categories.filter(x => x.id !== c.id);
      userTx.forEach(t => { if (t.categoryId === c.id) t.categoryId = 'uncat'; }); store.set(CONFIG.STORAGE_KEYS.userTx, userTx);
      saveCats(); TX = allTx(); closeSheet(); render(false); toast('Deleted · moved to Uncategorised');
    };
  };
  openSheet(isNew ? 'New category' : 'Edit category', '', draw);
}

function addSheet(){
  const now = new Date(), p = x => String(x).padStart(2,'0');
  const st = { type:'expense', cat:null };
  const draw = body => {
    const cats = categories.filter(c => c.kind === st.type || c.id === 'uncat');
    if (!cats.find(c => c.id === st.cat)) st.cat = cats[0] && cats[0].id;
    const keep = id => (body.querySelector('#' + id) || {}).value;
    const amt = keep('atAmt') || '', note = keep('atNote') || '', dt = keep('atDate') || `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`;
    body.innerHTML = `
      <div class="seg" style="display:flex;margin:4px 0 0"><button style="flex:1" data-t="expense" class="${st.type==='expense'?'on':''}">Expense</button><button style="flex:1" data-t="income" class="${st.type==='income'?'on':''}">Income</button></div>
      <label class="f" for="atAmt">Amount (${CONFIG.CURRENCY_SYMBOL})</label><input class="inp amtinp" id="atAmt" type="text" inputmode="decimal" placeholder="0.00" value="${esc(amt)}" autocomplete="off">
      <label class="f">Category</label><div class="chips">${cats.map(c => `<button class="chip ${c.id===st.cat?'on':''}" data-c="${c.id}" style="--c:${c.color}"><span>${c.icon}</span>${esc(c.name)}</button>`).join('')}</div>
      <label class="f" for="atNote">Note</label><input class="inp" id="atNote" maxlength="40" placeholder="e.g. Woolworths" value="${esc(note)}" autocomplete="off">
      <label class="f" for="atDate">Date &amp; time</label><input class="inp" id="atDate" type="datetime-local" value="${dt}">
      <div class="btnrow"><button class="btn primary" id="atSave">Add ${st.type}</button></div>
      <div class="note">Placeholder entry form — saved on this device only.</div>`;
    body.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { st.type = b.dataset.t; draw(body); });
    body.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { st.cat = b.dataset.c; body.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
    body.querySelector('#atSave').onclick = () => {
      const v = parseFloat(String(body.querySelector('#atAmt').value).replace(/\s/g,'').replace(',', '.'));
      if (!(v > 0)){ body.querySelector('#atAmt').focus(); toast('Enter an amount'); return; }
      const d = body.querySelector('#atDate').value || dt;
      userTx.push({ id:'u' + Date.now(), date:d.slice(0,16), amount:Math.round(v*100)/100, categoryId:st.cat || 'uncat', note:body.querySelector('#atNote').value.trim(), type:st.type });
      store.set(CONFIG.STORAGE_KEYS.userTx, userTx); TX = allTx(); closeSheet(); render(false); toast('Added ' + money(v, true));
    };
  };
  openSheet('Add transaction', '', draw);
}

/* ============================ EVENTS ============================ */
document.querySelectorAll('.seg button[data-p]').forEach(b => b.onclick = () => { S.period = b.dataset.p; S.anchor = new Date(); render(); });
$('prev').onclick = () => { S.anchor = shift(S.period, S.anchor, -1); render(); };
$('next').onclick = () => { S.anchor = shift(S.period, S.anchor, 1); render(); };
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
$('fab').onclick = addSheet;
$('overlay').onclick = closeSheet; $('sheetClose').onclick = closeSheet;
let resetArmed = false;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'sumType'){ S.sumType = el.dataset.v; render(false); }
  else if (a === 'sort'){ S.sort = { amount:'count', count:'name', name:'amount' }[S.sort]; render(false); }
  else if (a === 'drill') drill(id);
  else if (a === 'editCat'){ if ($('sheet').classList.contains('open')){ closeSheet(); setTimeout(() => catEditor(id), 260); } else catEditor(id); }
  else if (a === 'newCat') catEditor(null);
  else if (a === 'resetCats'){
    if (!resetArmed){ resetArmed = true; el.classList.add('arm'); el.textContent = 'Tap again to reset'; setTimeout(() => { resetArmed = false; el.classList.remove('arm'); el.textContent = 'Reset to defaults'; }, 3000); return; }
    resetArmed = false; categories = clone(DEFAULT_CATEGORIES); saveCats(); TX = allTx(); render(false); toast('Categories reset');
  }
});
// swipe left/right on the content to move between periods
let sx = null, sy = null;
main.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
main.addEventListener('touchend', e => { if (sx === null || S.tab === 'categories') return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){ if (dx > 0) $('prev').click(); else if (!$('next').disabled) $('next').click(); } }, { passive:true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.GeldApp = { S, render, go, drill, catEditor, addSheet, closeSheet, get categories(){ return categories; } };
render();
</script>
<script>
/* Offline support: register the service worker (relative path so it works under /<repo>/ on GitHub Pages). */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).catch(e => console.warn('SW registration failed', e)));
}
</script>
</body>
</html>
